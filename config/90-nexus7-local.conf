loglevel=1
firmware_class.path=/lib/firmware/postmarketos
msm.fbdev=0
# SPC idle state hangs the boot on this board (r8, 2026-11-15).
cpuidle.off=1
# performance at boot (all cores fixed at 1512 MHz) froze r11 about 50 s into boot, 5 times out of 5; schedutil boots (2026-11-15).
cpufreq.default_governor=schedutil
